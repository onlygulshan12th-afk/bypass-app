name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Full Flutter Project
        run: |
          mkdir temp_app
          flutter create --org com.bypasspro temp_app
          cp -r temp_app/android ./android
          cp temp_app/.metadata ./.metadata || true
          rm -rf temp_app
          cat << 'EOF' > pubspec.yaml
          name: bypass_pro
          description: "Shortener Bypass Native App"
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            url_launcher: ^6.3.0
            shared_preferences: ^2.2.3
          flutter:
            uses-material-design: true
          EOF

      - name: Build Release APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bypass-Pro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build Bypass Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Project & Liquid Glass UI
        run: |
          flutter create --org com.pulsevive.bypasspro bypass_app
          cd bypass_app

          cat << 'EOF' > pubspec.yaml
          name: bypass_app
          description: "Bypass Pro Liquid Glass App"
          publish_to: 'none'
          version: 2.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            http: ^1.2.0
            url_launcher: ^6.3.0
            shared_preferences: ^2.2.3

          flutter:
            uses-material-design: true
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="http" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="tg" />
                  </intent>
              </queries>
              <application
                  android:label="Bypass Pro"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:ui';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.light,
            ));
            runApp(const BypassProApp());
          }

          class BypassProApp extends StatelessWidget {
            const BypassProApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Bypass Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF06080E),
                ),
                home: const BypassHomeScreen(),
              );
            }
          }

          class BypassHomeScreen extends StatefulWidget {
            const BypassHomeScreen({super.key});

            @override
            State<BypassHomeScreen> createState() => _BypassHomeScreenState();
          }

          class _BypassHomeScreenState extends State<BypassHomeScreen>
              with SingleTickerProviderStateMixin {
            final TextEditingController _urlCtrl = TextEditingController();
            final String _tgUrl = "https://t.me/sterniterspro";
            final String _apiEndpoint =
                "https://altaf-api-maker.base44.app/functions/lookup?tool=shortner-bypass&key=Bypass&q=";

            bool _loading = false;
            bool _autoBypass = true;
            String _unlockedUrl = "";
            String _errorText = "";
            double _speedSec = 0.0;
            List> _history = [];

            int _themeIndex = 0;
            final List<Color> _themeColors = const [
              Color(0xFF38BDF8), // Cyber Blue
              Color(0xFFF43F5E), // Crimson Red
              Color(0xFFFACC15), // Electric Gold
              Color(0xFF10B981), // Emerald Green
            ];

            Color get _accent => _themeColors[_themeIndex];

            @override
            void initState() {
              super.initState();
              _initData();
            }

            Future<void> _initData() async {
              final prefs = await SharedPreferences.getInstance();
              final joined = prefs.getBool('joined_tg_v2') ?? false;
              final savedTheme = prefs.getInt('theme_idx') ?? 0;
              final rawHist = prefs.getStringList('history_v2') ?? [];

              setState(() {
                _themeIndex = savedTheme.clamp(0, _themeColors.length - 1);
                _history = rawHist.map((e) {
                  try {
                    return Map<String, String>.from(jsonDecode(e));
                  } catch (_) {
                    return {"src": "Short Link", "dest": e, "time": "Saved"};
                  }
                }).toList();
              });

              if (!joined) {
                WidgetsBinding.instance.addPostFrameCallback((_) {
                  _showLiquidTelegramDialog();
                });
              }
            }

            Future<void> _cycleTheme() async {
              final next = (_themeIndex + 1) % _themeColors.length;
              setState(() => _themeIndex = next);
              final prefs = await SharedPreferences.getInstance();
              await prefs.setInt('theme_idx', next);
            }

            Future<void> _saveToHistory(String src, String dest) async {
              final prefs = await SharedPreferences.getInstance();
              final now = TimeOfDay.now();
              final timeStr =
                  "${now.hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}";
              _history.removeWhere((item) => item['dest'] == dest);
              _history.insert(0, {"src": src, "dest": dest, "time": timeStr});
              if (_history.length > 12) _history.removeLast();

              await prefs.setStringList(
                'history_v2',
                _history.map((e) => jsonEncode(e)).toList(),
              );
              setState(() {});
            }

            void _showLiquidTelegramDialog() {
              showGeneralDialog(
                context: context,
                barrierDismissible: false,
                barrierColor: Colors.black.withOpacity(0.75),
                transitionDuration: const Duration(milliseconds: 280),
                pageBuilder: (ctx, anim1, anim2) {
                  return BackdropFilter(
                    filter: ImageFilter.blur(sigmaX: 14, sigmaY: 14),
                    child: Center(
                      child: Container(
                        margin: const EdgeInsets.symmetric(horizontal: 24),
                        padding: const EdgeInsets.all(22),
                        decoration: BoxDecoration(
                          color: const Color(0xFF101522).withOpacity(0.88),
                          borderRadius: BorderRadius.circular(26),
                          border: Border.all(
                            color: _accent.withOpacity(0.45),
                            width: 1.4,
                          ),
                          boxShadow: [
                            BoxShadow(
                              color: _accent.withOpacity(0.22),
                              blurRadius: 32,
                              spreadRadius: 2,
                            )
                          ],
                        ),
                        child: Material(
                          color: Colors.transparent,
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Container(
                                padding: const EdgeInsets.all(14),
                                decoration: BoxDecoration(
                                  shape: BoxShape.circle,
                                  color: _accent.withOpacity(0.15),
                                  border: Border.all(color: _accent.withOpacity(0.4)),
                                ),
                                child: Icon(Icons.telegram_rounded,
                                    size: 40, color: _accent),
                              ),
                              const SizedBox(height: 16),
                              const Text(
                                "VIP Access Required",
                                style: TextStyle(
                                  fontSize: 20,
                                  fontWeight: FontWeight.w800,
                                  color: Colors.white,
                                  letterSpacing: 0.3,
                                ),
                              ),
                              const SizedBox(height: 8),
                              const Text(
                                "Ad-free instant shortener bypass use karne ke liye pehle hamara official Telegram channel join karein.",
                                textAlign: TextAlign.center,
                                style: TextStyle(
                                  fontSize: 13.5,
                                  color: Colors.white70,
                                  height: 1.45,
                                ),
                              ),
                              const SizedBox(height: 22),
                              SizedBox(
                                width: double.infinity,
                                height: 48,
                                child: ElevatedButton.icon(
                                  style: ElevatedButton.styleFrom(
                                    backgroundColor: _accent,
                                    foregroundColor: Colors.black,
                                    shape: RoundedRectangleBorder(
                                      borderRadius: BorderRadius.circular(14),
                                    ),
                                    elevation: 8,
                                  ),
                                  icon: const Icon(Icons.rocket_launch_rounded, size: 18),
                                  label: const Text(
                                    "1. Join @sterniterspro",
                                    style: TextStyle(
                                        fontWeight: FontWeight.w800, fontSize: 14.5),
                                  ),
                                  onPressed: () async {
                                    final uri = Uri.parse(_tgUrl);
                                    await launchUrl(uri,
                                        mode: LaunchMode.externalApplication);
                                  },
                                ),
                              ),
                              const SizedBox(height: 10),
                              SizedBox(
                                width: double.infinity,
                                height: 46,
                                child: OutlinedButton(
                                  style: OutlinedButton.styleFrom(
                                    foregroundColor: Colors.white,
                                    side: BorderSide(
                                        color: Colors.white.withOpacity(0.2)),
                                    shape: RoundedRectangleBorder(
                                      borderRadius: BorderRadius.circular(14),
                                    ),
                                  ),
                                  onPressed: () async {
                                    final prefs =
                                        await SharedPreferences.getInstance();
                                    await prefs.setBool('joined_tg_v2', true);
                                    if (ctx.mounted) Navigator.pop(ctx);
                                  },
                                  child: const Text(
                                    "2. I Have Joined • Unlock App",
                                    style: TextStyle(
                                        fontWeight: FontWeight.w700, fontSize: 13.5),
                                  ),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  );
                },
              );
            }

            Future<void> _runBypass() async {
              final raw = _urlCtrl.text.trim();
              if (raw.isEmpty) {
                setState(() => _errorText = "Bhai pehle shortener link toh daalo!");
                return;
              }

              FocusScope.of(context).unfocus();
              setState(() {
                _loading = true;
                _errorText = "";
                _unlockedUrl = "";
              });

              final sw = Stopwatch()..start();

              try {
                final uri =
                    Uri.parse("$_apiEndpoint${Uri.encodeComponent(raw)}");
                final res =
                    await http.get(uri).timeout(const Duration(seconds: 22));
                sw.stop();

                if (res.statusCode == 200) {
                  String out = "";
                  try {
                    final decoded = jsonDecode(res.body);
                    if (decoded is Map) {
                      out = (decoded['result'] ??
                              decoded['url'] ??
                              decoded['destination'] ??
                              decoded['bypassed_url'] ??
                              decoded['data'] ??
                              decoded['link'] ??
                              res.body)
                          .toString();
                    } else {
                      out = res.body.trim();
                    }
                  } catch (_) {
                    out = res.body.trim();
                  }

                  if (out.isEmpty || out == "null" || out == "{}") {
                    setState(() => _errorText =
                        "Ye link abhi resolve nahi ho paya, dobara try karo.");
                  } else {
                    setState(() {
                      _unlockedUrl = out;
                      _speedSec = sw.elapsedMilliseconds / 1000.0;
                    });
                    _saveToHistory(raw, out);
                  }
                } else {
                  setState(() =>
                      _errorText = "Server error (${res.statusCode}). Try again!");
                }
              } catch (e) {
                setState(() => _errorText =
                    "Network timeout ya link invalid hai. Check connection!");
              } finally {
                setState(() => _loading = false);
              }
            }

            Future<void> _pasteAndGo() async {
              final clip = await Clipboard.getData('text/plain');
              final text = clip?.text?.trim() ?? "";
              if (text.isNotEmpty) {
                setState(() {
                  _urlCtrl.text = text;
                  _errorText = "";
                });
                if (_autoBypass) {
                  _runBypass();
                }
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Stack(
                  children: [
                    Positioned(
                      top: -90,
                      left: -70,
                      child: Container(
                        width: 260,
                        height: 260,
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          color: _accent.withOpacity(0.22),
                        ),
                      ),
                    ),
                    Positioned(
                      bottom: -100,
                      right: -80,
                      child: Container(
                        width: 280,
                        height: 280,
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          color: const Color(0xFF6366F1).withOpacity(0.18),
                        ),
                      ),
                    ),
                    BackdropFilter(
                      filter: ImageFilter.blur(sigmaX: 70, sigmaY: 70),
                      child: Container(color: Colors.transparent),
                    ),

                    SafeArea(
                      child: SingleChildScrollView(
                        padding: const EdgeInsets.fromLTRB(16, 12, 16, 28),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            Container(
                              padding: const EdgeInsets.symmetric(
                                  horizontal: 14, vertical: 10),
                              decoration: BoxDecoration(
                                color: Colors.white.withOpacity(0.05),
                                borderRadius: BorderRadius.circular(18),
                                border: Border.all(
                                    color: Colors.white.withOpacity(0.1)),
                              ),
                              child: Row(
                                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                children: [
                                  Row(
                                    children: [
                                      Container(
                                        padding: const EdgeInsets.all(8),
                                        decoration: BoxDecoration(
                                          color: _accent.withOpacity(0.18),
                                          borderRadius: BorderRadius.circular(12),
                                        ),
                                        child: Icon(Icons.bolt_rounded,
                                            color: _accent, size: 22),
                                      ),
                                      const SizedBox(width: 10),
                                      const Column(
                                        crossAxisAlignment:
                                            CrossAxisAlignment.start,
                                        children: [
                                          Text(
                                            "BYPASS PRO",
                                            style: TextStyle(
                                              fontWeight: FontWeight.w900,
                                              fontSize: 16,
                                              letterSpacing: 0.8,
                                            ),
                                          ),
                                          Text(
                                            "Instant Key & Link Unlocker",
                                            style: TextStyle(
                                              fontSize: 11,
                                              color: Colors.white54,
                                            ),
                                          ),
                                        ],
                                      ),
                                    ],
                                  ),
                                  Row(
                                    children: [
                                      IconButton(
                                        tooltip: "Switch Neon Theme",
                                        onPressed: _cycleTheme,
                                        icon: Icon(Icons.palette_rounded,
                                            color: _accent),
                                      ),
                                      IconButton(
                                        tooltip: "Telegram Channel",
                                        onPressed: () => launchUrl(
                                            Uri.parse(_tgUrl),
                                            mode: LaunchMode.externalApplication),
                                        icon: const Icon(Icons.telegram_rounded,
                                            color: Colors.white),
                                      ),
                                    ],
                                  )
                                ],
                              ),
                            ),

                            const SizedBox(height: 18),

                            Container(
                              padding: const EdgeInsets.all(18),
                              decoration: BoxDecoration(
                                color: const Color(0xFF101420).withOpacity(0.82),
                                borderRadius: BorderRadius.circular(24),
                                border: Border.all(
                                  color: _accent.withOpacity(0.3),
                                  width: 1.2,
                                ),
                                boxShadow: [
                                  BoxShadow(
                                    color: Colors.black.withOpacity(0.45),
                                    blurRadius: 24,
                                    offset: const Offset(0, 12),
                                  )
                                ],
                              ),
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Row(
                                    mainAxisAlignment:
                                        MainAxisAlignment.spaceBetween,
                                    children: [
                                      Row(
                                        children: [
                                          Container(
                                            width: 8,
                                            height: 8,
                                            decoration: BoxDecoration(
                                              shape: BoxShape.circle,
                                              color: _accent,
                                              boxShadow: [
                                                BoxShadow(
                                                    color: _accent, blurRadius: 6)
                                              ],
                                            ),
                                          ),
                                          const SizedBox(width: 8),
                                          const Text(
                                            "PASTE SHORTENER URL",
                                            style: TextStyle(
                                              fontSize: 11.5,
                                              fontWeight: FontWeight.w800,
                                              color: Colors.white70,
                                              letterSpacing: 0.7,
                                            ),
                                          ),
                                        ],
                                      ),
                                      GestureDetector(
                                        onTap: () => setState(
                                            () => _autoBypass = !_autoBypass),
                                        child: Text(
                                          _autoBypass
                                              ? "⚡ Auto-Bypass: ON"
                                              : "Auto-Bypass: OFF",
                                          style: TextStyle(
                                            fontSize: 11,
                                            fontWeight: FontWeight.w700,
                                            color: _autoBypass
                                                ? _accent
                                                : Colors.white38,
                                          ),
                                        ),
                                      )
                                    ],
                                  ),
                                  const SizedBox(height: 12),
                                  TextField(
                                    controller: _urlCtrl,
                                    style: const TextStyle(
                                        fontSize: 14, color: Colors.white),
                                    onSubmitted: (_) => _runBypass(),
                                    decoration: InputDecoration(
                                      hintText:
                                          "https://gplinks.co/... or droplink...",
                                      hintStyle: const TextStyle(
                                          color: Colors.white30, fontSize: 13.5),
                                      filled: true,
                                      fillColor: const Color(0xFF07090F),
                                      contentPadding:
                                          const EdgeInsets.symmetric(
                                              horizontal: 16, vertical: 16),
                                      border: OutlineInputBorder(
                                        borderRadius: BorderRadius.circular(16),
                                        borderSide: BorderSide(
                                            color: Colors.white.withOpacity(0.08)),
                                      ),
                                      enabledBorder: OutlineInputBorder(
                                        borderRadius: BorderRadius.circular(16),
                                        borderSide: BorderSide(
                                            color: Colors.white.withOpacity(0.08)),
                                      ),
                                      focusedBorder: OutlineInputBorder(
                                        borderRadius: BorderRadius.circular(16),
                                        borderSide:
                                            BorderSide(color: _accent, width: 1.4),
                                      ),
                                      suffixIcon: Row(
                                        mainAxisSize: MainAxisSize.min,
                                        children: [
                                          if (_urlCtrl.text.isNotEmpty)
                                            IconButton(
                                              icon: const Icon(Icons.clear_rounded,
                                                  size: 18, color: Colors.white54),
                                              onPressed: () =>
                                                  setState(() => _urlCtrl.clear()),
                                            ),
                                          IconButton(
                                            tooltip: "Paste from Clipboard",
                                            icon: Icon(
                                                Icons.content_paste_go_rounded,
                                                color: _accent),
                                            onPressed: _pasteAndGo,
                                          ),
                                        ],
                                      ),
                                    ),
                                    onChanged: (_) => setState(() {}),
                                  ),
                                  const SizedBox(height: 14),
                                  SizedBox(
                                    width: double.infinity,
                                    height: 52,
                                    child: ElevatedButton(
                                      style: ElevatedButton.styleFrom(
                                        backgroundColor: _accent,
                                        foregroundColor: Colors.black,
                                        elevation: 10,
                                        shadowColor: _accent.withOpacity(0.5),
                                        shape: RoundedRectangleBorder(
                                          borderRadius: BorderRadius.circular(16),
                                        ),
                                      ),
                                      onPressed: _loading ? null : _runBypass,
                                      child: _loading
                                          ? const SizedBox(
                                              width: 22,
                                              height: 22,
                                              child: CircularProgressIndicator(
                                                strokeWidth: 2.5,
                                                color: Colors.black,
                                              ),
                                            )
                                          : const Row(
                                              mainAxisAlignment:
                                                  MainAxisAlignment.center,
                                              children: [
                                                Icon(Icons.flash_on_rounded,
                                                    size: 20),
                                                SizedBox(width: 6),
                                                Text(
                                                  "BYPASS NOW",
                                                  style: TextStyle(
                                                    fontSize: 15,
                                                    fontWeight: FontWeight.w900,
                                                    letterSpacing: 0.8,
                                                  ),
                                                ),
                                              ],
                                            ),
                                    ),
                                  ),
                                  if (_errorText.isNotEmpty) ...[
                                    const SizedBox(height: 12),
                                    Container(
                                      padding: const EdgeInsets.all(12),
                                      decoration: BoxDecoration(
                                        color: const Color(0xFFEF4444)
                                            .withOpacity(0.14),
                                        borderRadius: BorderRadius.circular(12),
                                        border: Border.all(
                                            color: const Color(0xFFEF4444)
                                                .withOpacity(0.4)),
                                      ),
                                      child: Row(
                                        children: [
                                          const Icon(Icons.error_outline_rounded,
                                              color: Color(0xFFF87171), size: 18),
                                          const SizedBox(width: 8),
                                          Expanded(
                                            child: Text(
                                              _errorText,
                                              style: const TextStyle(
                                                  color: Color(0xFFFCA5A5),
                                                  fontSize: 12.5),
                                            ),
                                          ),
                                        ],
                                      ),
                                    ),
                                  ],
                                ],
                              ),
                            ),

                            if (_unlockedUrl.isNotEmpty) ...[
                              const SizedBox(height: 16),
                              Container(
                                padding: const EdgeInsets.all(18),
                                decoration: BoxDecoration(
                                  color: const Color(0xFF0B1F1B).withOpacity(0.85),
                                  borderRadius: BorderRadius.circular(22),
                                  border: Border.all(
                                    color:
                                        const Color(0xFF10B981).withOpacity(0.45),
                                    width: 1.3,
                                  ),
                                ),
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Row(
                                      mainAxisAlignment:
                                          MainAxisAlignment.spaceBetween,
                                      children: [
                                        const Row(
                                          children: [
                                            Icon(Icons.verified_rounded,
                                                color: Color(0xFF10B981), size: 18),
                                            SizedBox(width: 6),
                                            Text(
                                              "DESTINATION UNLOCKED",
                                              style: TextStyle(
                                                color: Color(0xFF10B981),
                                                fontWeight: FontWeight.w800,
                                                fontSize: 12,
                                                letterSpacing: 0.6,
                                              ),
                                            ),
                                          ],
                                        ),
                                        Container(
                                          padding: const EdgeInsets.symmetric(
                                              horizontal: 8, vertical: 3),
                                          decoration: BoxDecoration(
                                            color: Colors.white.withOpacity(0.08),
                                            borderRadius: BorderRadius.circular(8),
                                          ),
                                          child: Text(
                                            "⚡ ${_speedSec.toStringAsFixed(2)}s",
                                            style: const TextStyle(
                                                fontSize: 11,
                                                color: Colors.white70),
                                          ),
                                        ),
                                      ],
                                    ),
                                    const SizedBox(height: 12),
                                    Container(
                                      width: double.infinity,
                                      padding: const EdgeInsets.all(12),
                                      decoration: BoxDecoration(
                                        color: Colors.black.withOpacity(0.45),
                                        borderRadius: BorderRadius.circular(12),
                                        border: Border.all(
                                            color: Colors.white.withOpacity(0.08)),
                                      ),
                                      child: SelectableText(
                                        _unlockedUrl,
                                        style: TextStyle(
                                          fontFamily: 'monospace',
                                          fontSize: 13,
                                          color: _accent,
                                          fontWeight: FontWeight.w600,
                                        ),
                                      ),
                                    ),
                                    const SizedBox(height: 14),
                                    Row(
                                      children: [
                                        Expanded(
                                          child: SizedBox(
                                            height: 44,
                                            child: OutlinedButton.icon(
                                              style: OutlinedButton.styleFrom(
                                                foregroundColor: Colors.white,
                                                side: BorderSide(
                                                    color:
                                                        _accent.withOpacity(0.6)),
                                                shape: RoundedRectangleBorder(
                                                  borderRadius:
                                                      BorderRadius.circular(12),
                                                ),
                                              ),
                                              icon: const Icon(Icons.copy_rounded,
                                                  size: 17),
                                              label: const Text("Copy Key/Link",
                                                  style: TextStyle(
                                                      fontWeight: FontWeight.w700)),
                                              onPressed: () {
                                                Clipboard.setData(ClipboardData(
                                                    text: _unlockedUrl));
                                                ScaffoldMessenger.of(context)
                                                    .showSnackBar(
                                                  const SnackBar(

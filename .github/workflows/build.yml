name: Build Bypass Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup & Build Flutter App
        run: |
          flutter create --org com.pulsevive.bypasspro my_app
          cd my_app

          # Dependencies add karein
          flutter pub add http url_launcher shared_preferences

          # Android minSdk 21 ensure karein taaki package clash na ho
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdk/minSdk = 21/g' android/app/build.gradle || true

          # Internet permission add karein (clean append before </manifest>)
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET"/>\n</manifest>|g' android/app/src/main/AndroidManifest.xml

          # Liquid Glass UI code write karein
          cat << 'EOF' > lib/main.dart
          import 'dart:convert';
          import 'dart:ui';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:http/http.dart' as http;
          import 'package:url_launcher/url_launcher.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.light,
            ));
            runApp(const BypassProApp());
          }

          class BypassProApp extends StatelessWidget {
            const BypassProApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Bypass Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF06080E),
                ),
                home: const BypassHomeScreen(),
              );
            }
          }

          class BypassHomeScreen extends StatefulWidget {
            const BypassHomeScreen({super.key});

            @override
            State<BypassHomeScreen> createState() => _BypassHomeScreenState();
          }

          class _BypassHomeScreenState extends State<BypassHomeScreen> {
            final TextEditingController _urlCtrl = TextEditingController();
            final String _tgUrl = "https://t.me/sterniterspro";
            final String _apiEndpoint =
                "https://altaf-api-maker.base44.app/functions/lookup?tool=shortner-bypass&key=Bypass&q=";

            bool _loading = false;
            bool _autoBypass = true;
            String _unlockedUrl = "";
            String _errorText = "";
            double _speedSec = 0.0;
            List> _history = [];

            int _themeIndex = 0;
            final List<Color> _themeColors = [
              const Color(0xFF38BDF8),
              const Color(0xFFF43F5E),
              const Color(0xFFFACC15),
              const Color(0xFF10B981),
            ];

            Color get _accent => _themeColors[_themeIndex];

            @override
            void initState() {
              super.initState();
              _initData();
            }

            Future<void> _initData() async {
              final prefs = await SharedPreferences.getInstance();
              final joined = prefs.getBool('joined_tg_v2') ?? false;
              final savedTheme = prefs.getInt('theme_idx') ?? 0;
              final rawHist = prefs.getStringList('history_v2') ?? [];

              setState(() {
                _themeIndex = savedTheme.clamp(0, _themeColors.length - 1);
                _history = rawHist.map((e) {
                  try {
                    return Map<String, String>.from(jsonDecode(e));
                  } catch (_) {
                    return {"src": "Short Link", "dest": e, "time": "Saved"};
                  }
                }).toList();
              });

              if (!joined) {
                WidgetsBinding.instance.addPostFrameCallback((_) {
                  _showLiquidTelegramDialog();
                });
              }
            }

            Future<void> _cycleTheme() async {
              final next = (_themeIndex + 1) % _themeColors.length;
              setState(() => _themeIndex = next);
              final prefs = await SharedPreferences.getInstance();
              await prefs.setInt('theme_idx', next);
            }

            Future<void> _saveToHistory(String src, String dest) async {
              final prefs = await SharedPreferences.getInstance();
              final now = TimeOfDay.now();
              final timeStr =
                  "${now.hour.toString().padLeft(2, '0')}:${now.minute.toString().padLeft(2, '0')}";
              _history.removeWhere((item) => item['dest'] == dest);
              _history.insert(0, {"src": src, "dest": dest, "time": timeStr});
              if (_history.length > 12) _history.removeLast();

              await prefs.setStringList(
                'history_v2',
                _history.map((e) => jsonEncode(e)).toList(),
              );
              setState(() {});
            }

            void _showLiquidTelegramDialog() {
              showGeneralDialog(
                context: context,
                barrierDismissible: false,
                barrierColor: Colors.black.withOpacity(0.75),
                transitionDuration: const Duration(milliseconds: 280),
                pageBuilder: (ctx, anim1, anim2) {
                  return BackdropFilter(
                    filter: ImageFilter.blur(sigmaX: 14, sigmaY: 14),
                    child: Center(
                      child: Container(
                        margin: const EdgeInsets.symmetric(horizontal: 24),
                        padding: const EdgeInsets.all(22),
                        decoration: BoxDecoration(
                          color: const Color(0xFF101522).withOpacity(0.88),
                          borderRadius: BorderRadius.circular(26),
                          border: Border.all(
                            color: _accent.withOpacity(0.45),
                            width: 1.4,
                          ),
                        ),
                        child: Material(
                          color: Colors.transparent,
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Container(
                                padding: const EdgeInsets.all(14),
                                decoration: BoxDecoration(
                                  shape: BoxShape.circle,
                                  color: _accent.withOpacity(0.15),
                                  border: Border.all(color: _accent.withOpacity(0.4)),
                                ),
                                child: Icon(Icons.telegram_rounded,
                                    size: 40, color: _accent),
                              ),
                              const SizedBox(height: 16),
                              const Text(
                                "VIP Access Required",
                                style: TextStyle(
                                  fontSize: 20,
                                  fontWeight: FontWeight.w800,
                                  color: Colors.white,
                                ),
                              ),
                              const SizedBox(height: 8),
                              const Text(
                                "Bypass tool use karne ke liye official channel join karein.",
                                textAlign: TextAlign.center,
                                style: TextStyle(
                                  fontSize: 13.5,
                                  color: Colors.white70,
                                ),
                              ),
                              const SizedBox(height: 22),
                              SizedBox(
                                width: double.infinity,
                                height: 48,
                                child: ElevatedButton.icon(
                                  style: ElevatedButton.styleFrom(
                                    backgroundColor: _accent,
                                    foregroundColor: Colors.black,
                                    shape: RoundedRectangleBorder(
                                      borderRadius: BorderRadius.circular(14),
                                    ),
                                  ),
                                  icon: const Icon(Icons.rocket_launch_rounded, size: 18),
                                  label: const Text(
                                    "1. Join @sterniterspro",
                                    style: TextStyle(fontWeight: FontWeight.w800),
                                  ),
                                  onPressed: () async {
                                    final uri = Uri.parse(_tgUrl);
                                    await launchUrl(uri,
                                        mode: LaunchMode.externalApplication);
                                  },
                                ),
                              ),
                              const SizedBox(height: 10),
                              SizedBox(
                                width: double.infinity,
                                height: 46,
                                child: OutlinedButton(
                                  style: OutlinedButton.styleFrom(
                                    foregroundColor: Colors.white,
                                    side: BorderSide(
                                        color: Colors.white.withOpacity(0.2)),
                                    shape: RoundedRectangleBorder(
                                      borderRadius: BorderRadius.circular(14),
                                    ),
                                  ),
                                  onPressed: () async {
                                    final prefs =
                                        await SharedPreferences.getInstance();
                                    await prefs.setBool('joined_tg_v2', true);
                                    if (ctx.mounted) Navigator.pop(ctx);
                                  },
                                  child: const Text("2. I Have Joined"),
                                ),
                              ),
                            ],
                          ),
                        ),
                      ),
                    ),
                  );
                },
              );
            }

            Future<void> _runBypass() async {
              final raw = _urlCtrl.text.trim();
              if (raw.isEmpty) {
                setState(() => _errorText = "Pehle shortener link paste karo!");
                return;
              }

              FocusScope.of(context).unfocus();
              setState(() {
                _loading = true;
                _errorText = "";
                _unlockedUrl = "";
              });

              final sw = Stopwatch()..start();

              try {
                final uri =
                    Uri.parse("$_apiEndpoint${Uri.encodeComponent(raw)}");
                final res =
                    await http.get(uri).timeout(const Duration(seconds: 22));
                sw.stop();

                if (res.statusCode == 200) {
                  String out = "";
                  try {
                    final decoded = jsonDecode(res.body);
                    if (decoded is Map) {
                      out = (decoded['result'] ??
                              decoded['url'] ??
                              decoded['destination'] ??
                              decoded['bypassed_url'] ??
                              decoded['data'] ??
                              decoded['link'] ??
                              res.body)
                          .toString();
                    } else {
                      out = res.body.trim();
                    }
                  } catch (_) {
                    out = res.body.trim();
                  }

                  if (out.isEmpty || out == "null" || out == "{}") {
                    setState(() => _errorText = "Link resolve nahi ho paya.");
                  } else {
                    setState(() {
                      _unlockedUrl = out;
                      _speedSec = sw.elapsedMilliseconds / 1000.0;
                    });
                    _saveToHistory(raw, out);
                  }
                } else {
                  setState(() => _errorText = "Server Error (${res.statusCode})");
                }
              } catch (e) {
                setState(() => _errorText = "Network timeout ya slow internet.");
              } finally {
                setState(() => _loading = false);
              }
            }

            Future<void> _pasteAndGo() async {
              final clip = await Clipboard.getData('text/plain');
              final text = clip?.text?.trim() ?? "";
              if (text.isNotEmpty) {
                setState(() {
                  _urlCtrl.text = text;
                  _errorText = "";
                });
                if (_autoBypass) _runBypass();
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Stack(
                  children: [
                    Positioned(
                      top: -80,
                      left: -60,
                      child: Container(
                        width: 240,
                        height: 240,
                        decoration: BoxDecoration(
                          shape: BoxShape.circle,
                          color: _accent.withOpacity(0.2),
                        ),
                      ),
                    ),
                    BackdropFilter(
                      filter: ImageFilter.blur(sigmaX: 70, sigmaY: 70),
                      child: Container(color: Colors.transparent),
                    ),
                    SafeArea(
                      child: SingleChildScrollView(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            Container(
                              padding: const EdgeInsets.symmetric(
                                  horizontal: 14, vertical: 10),
                              decoration: BoxDecoration(
                                color: Colors.white.withOpacity(0.05),
                                borderRadius: BorderRadius.circular(18),
                                border: Border.all(
                                    color: Colors.white.withOpacity(0.1)),
                              ),
                              child: Row(
                                mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                children: [
                                  Row(
                                    children: [
                                      Icon(Icons.bolt_rounded, color: _accent, size: 24),
                                      const SizedBox(width: 8),
                                      const Text(
                                        "BYPASS PRO",
                                        style: TextStyle(
                                          fontWeight: FontWeight.w900,
                                          fontSize: 16,
                                        ),
                                      ),
                                    ],
                                  ),
                                  Row(
                                    children: [
                                      IconButton(
                                        icon: Icon(Icons.palette_rounded, color: _accent),
                                        onPressed: _cycleTheme,
                                      ),
                                      IconButton(
                                        icon: const Icon(Icons.telegram_rounded, color: Colors.white),
                                        onPressed: () => launchUrl(
                                            Uri.parse(_tgUrl),
                                            mode: LaunchMode.externalApplication),
                                      ),
                                    ],
                                  )
                                ],
                              ),
                            ),
                            const SizedBox(height: 18),
                            Container(
                              padding: const EdgeInsets.all(18),
                              decoration: BoxDecoration(
                                color: const Color(0xFF101420).withOpacity(0.85),
                                borderRadius: BorderRadius.circular(24),
                                border: Border.all(color: _accent.withOpacity(0.3)),
                              ),
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      const Text(
                                        "PASTE LINK",
                                        style: TextStyle(
                                          fontSize: 11,
                                          fontWeight: FontWeight.w800,
                                          color: Colors.white70,
                                        ),
                                      ),
                                      GestureDetector(
                                        onTap: () => setState(
                                            () => _autoBypass = !_autoBypass),
                                        child: Text(
                                          _autoBypass ? "⚡ Auto: ON" : "Auto: OFF",
                                          style: TextStyle(
                                              fontSize: 11,
                                              color: _autoBypass ? _accent : Colors.white38),
                                        ),
                                      ),
                                    ],
                                  ),
                                  const SizedBox(height: 10),
                                  TextField(
                                    controller: _urlCtrl,
                                    decoration: InputDecoration(
                                      hintText: "Paste shortener link here...",
                                      hintStyle: const TextStyle(color: Colors.white30, fontSize: 13),
                                      filled: true,
                                      fillColor: const Color(0xFF07090F),
                                      border: OutlineInputBorder(
                                        borderRadius: BorderRadius.circular(16),
                                        borderSide: BorderSide.none,
                                      ),
                                      suffixIcon: IconButton(
                                        icon: Icon(Icons.paste_rounded, color: _accent),
                                        onPressed: _pasteAndGo,
                                      ),
                                    ),
                                  ),
                                  const SizedBox(height: 14),
                                  SizedBox(
                                    width: double.infinity,
                                    height: 50,
                                    child: ElevatedButton(
                                      style: ElevatedButton.styleFrom(
                                        backgroundColor: _accent,
                                        foregroundColor: Colors.black,
                                        shape: RoundedRectangleBorder(
                                          borderRadius: BorderRadius.circular(16),
                                        ),
                                      ),
                                      onPressed: _loading ? null : _runBypass,
                                      child: _loading
                                          ? const SizedBox(
                                              width: 20,
                                              height: 20,
                                              child: CircularProgressIndicator(strokeWidth: 2, color: Colors.black),
                                            )
                                          : const Text(
                                              "⚡ BYPASS SHORTENER",
                                              style: TextStyle(fontWeight: FontWeight.w900),
                                            ),
                                    ),
                                  ),
                                  if (_errorText.isNotEmpty) ...[
                                    const SizedBox(height: 10),
                                    Text(_errorText, style: const TextStyle(color: Colors.redAccent, fontSize: 12)),
                                  ]
                                ],
                              ),
                            ),
                            if (_unlockedUrl.isNotEmpty) ...[
                              const SizedBox(height: 16),
                              Container(
                                padding: const EdgeInsets.all(16),
                                decoration: BoxDecoration(
                                  color: const Color(0xFF0B1F1B),
                                  borderRadius: BorderRadius.circular(20),
                                  border: Border.all(color: const Color(0xFF10B981)),
                                ),
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text("⚡ Unlocked in ${_speedSec.toStringAsFixed(2)}s",
                                        style: const TextStyle(color: Color(0xFF10B981), fontWeight: FontWeight.bold)),
                                    const SizedBox(height: 8),
                                    SelectableText(_unlockedUrl, style: TextStyle(color: _accent)),
                                    const SizedBox(height: 12),
                                    Row(
                                      children: [
                                        Expanded(
                                          child: OutlinedButton(
                                            onPressed: () {
                                              Clipboard.setData(ClipboardData(text: _unlockedUrl));
                                              ScaffoldMessenger.of(context).showSnackBar(
                                                  const SnackBar(content: Text("Copied!")));
                                            },
                                            child: const Text("Copy"),
                                          ),
                                        ),
                                        const SizedBox(width: 8),
                                        Expanded(
                                          child: ElevatedButton(
                                            style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF10B981)),
                                            onPressed: () => launchUrl(Uri.parse(_unlockedUrl),
                                                mode: LaunchMode.externalApplication),
                                            child: const Text("Open", style: TextStyle(color: Colors.black)),
                                          ),
                                        )
                                      ],
                                    )
                                  ],
                                ),
                              )
                            ],
                            const SizedBox(height: 20),
                            const Text("RECENT UNLOCKS", style: TextStyle(fontSize: 11, color: Colors.white38)),
                            const SizedBox(height: 8),
                            ..._history.map((item) => Container(
                                  margin: const EdgeInsets.only(bottom: 6),
                                  padding: const EdgeInsets.all(10),
                                  decoration: BoxDecoration(
                                    color: const Color(0xFF101420),
                                    borderRadius: BorderRadius.circular(12),
                                  ),
                                  child: Row(
                                    children: [
                                      Expanded(
                                        child: Text(item['dest'] ?? "",
                                            maxLines: 1,
                                            overflow: TextOverflow.ellipsis,
                                            style: TextStyle(color: _accent, fontSize: 12)),
                                      ),
                                      IconButton(
                                        icon: const Icon(Icons.copy, size: 16),
                                        onPressed: () => Clipboard.setData(
                                            ClipboardData(text: item['dest'] ?? "")),
                                      )
                                    ],
                                  ),
                                ))
                          ],
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }
          EOF

          # Build debug APK (Always succeeds without keystore/signing errors, installable on any Android)
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bypass-Pro-App
          path: my_app/build/app/outputs/flutter-apk/app-debug.apk

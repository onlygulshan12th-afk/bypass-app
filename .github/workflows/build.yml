name: Build Bypass Pro Native APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Construct Full Native Android App
        run: |
          mkdir -p native_app/app/src/main/java/com/pulsevive/bypasspro
          mkdir -p native_app/app/src/main/res/layout
          mkdir -p native_app/app/src/main/res/values
          mkdir -p native_app/app/src/main/res/drawable
          cd native_app

          # Root settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Bypass Pro"
          include ':app'
          EOF

          # Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          # App build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pulsevive.bypasspro'
              compileSdk 34

              defaultConfig {
                  applicationId "com.pulsevive.bypasspro"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Bypass Pro"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.BypassPro"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Colors & Themes
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#06080E</color>
              <color name="card_dark">#101524</color>
              <color name="accent_blue">#38BDF8</color>
              <color name="text_white">#F8FAFC</color>
              <color name="text_muted">#94A3B8</color>
              <color name="success_green">#10B981</color>
              <color name="input_bg">#070A12</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.BypassPro" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/bg_dark</item>
                  <item name="android:statusBarColor">@color/bg_dark</item>
                  <item name="colorPrimary">@color/accent_blue</item>
              </style>
          </resources>
          EOF

          # Rounded Card Drawables
          cat << 'EOF' > app/src/main/res/drawable/card_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#121829" />
              <corners android:radius="22dp" />
              <stroke android:width="1.2dp" android:color="#3338BDF8" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/result_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0D231C" />
              <corners android:radius="18dp" />
              <stroke android:width="1.2dp" android:color="#4D10B981" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/input_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#07090F" />
              <corners android:radius="14dp" />
              <stroke android:width="1dp" android:color="#26FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/btn_glow.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:startColor="#0EA5E9" android:endColor="#38BDF8" android:angle="45"/>
              <corners android:radius="14dp"/>
          </shape>
          EOF

          # Layout XML
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_dark"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="16dp">

                  <!-- Header Bar -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:background="@drawable/card_bg"
                      android:padding="12dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="⚡ BYPASS PRO"
                          android:textColor="@color/accent_blue"
                          android:textSize="18sp"
                          android:textStyle="bold" />

                      <ImageView
                          android:id="@+id/btnTgHeader"
                          android:layout_width="38dp"
                          android:layout_height="38dp"
                          android:padding="6dp"
                          android:src="@android:drawable/ic_menu_send"
                          app:tint="@color/text_white" />
                  </LinearLayout>

                  <!-- Bypass Card -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:background="@drawable/card_bg"
                      android:orientation="vertical"
                      android:padding="18dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="PASTE SHORTENER URL"
                          android:textColor="@color/text_muted"
                          android:textSize="11sp"
                          android:textStyle="bold" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="52dp"
                          android:layout_marginTop="10dp"
                          android:background="@drawable/input_bg"
                          android:gravity="center_vertical"
                          android:orientation="horizontal"
                          android:paddingStart="12dp"
                          android:paddingEnd="6dp">

                          <EditText
                              android:id="@+id/etUrl"
                              android:layout_width="0dp"
                              android:layout_height="match_parent"
                              android:layout_weight="1"
                              android:background="@null"
                              android:hint="https://gplinks.co/... or droplink..."
                              android:textColor="@color/text_white"
                              android:textColorHint="#475569"
                              android:textSize="13sp" />

                          <Button
                              android:id="@+id/btnPaste"
                              style="@style/Widget.MaterialComponents.Button.TextButton"
                              android:layout_width="wrap_content"
                              android:layout_height="38dp"
                              android:text="PASTE"
                              android:textColor="@color/accent_blue"
                              android:textSize="12sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <androidx.appcompat.widget.AppCompatButton
                          android:id="@+id/btnBypass"
                          android:layout_width="match_parent"
                          android:layout_height="52dp"
                          android:layout_marginTop="14dp"
                          android:background="@drawable/btn_glow"
                          android:text="⚡ BYPASS SHORTENER"
                          android:textColor="#000000"
                          android:textSize="14sp"
                          android:textStyle="bold" />

                      <ProgressBar
                          android:id="@+id/progressBar"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_gravity="center"
                          android:layout_marginTop="12dp"
                          android:indeterminateTint="@color/accent_blue"
                          android:visibility="gone" />
                  </LinearLayout>

                  <!-- Result Box -->
                  <LinearLayout
                      android:id="@+id/layoutResult"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:background="@drawable/result_bg"
                      android:orientation="vertical"
                      android:padding="16dp"
                      android:visibility="gone">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="✅ UNLOCKED DESTINATION"
                          android:textColor="@color/success_green"
                          android:textSize="12sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/tvResult"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:background="#1A000000"
                          android:padding="10dp"
                          android:textColor="@color/text_white"
                          android:textIsSelectable="true"
                          android:textSize="13sp" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="12dp"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnCopy"
                              style="@style/Widget.MaterialComponents.Button.OutlinedButton"
                              android:layout_width="0dp"
                              android:layout_height="44dp"
                              android:layout_weight="1"
                              android:text="Copy Key"
                              android:textColor="@color/text_white" />

                          <View
                              android:layout_width="10dp"
                              android:layout_height="1dp" />

                          <Button
                              android:id="@+id/btnOpen"
                              android:layout_width="0dp"
                              android:layout_height="44dp"
                              android:layout_weight="1"
                              android:backgroundTint="@color/success_green"
                              android:text="Open Link"
                              android:textColor="#000000" />
                      </LinearLayout>
                  </LinearLayout>

              </LinearLayout>
          </ScrollView>
          EOF

          # Pure Native MainActivity.java
          cat << 'EOF' > app/src/main/java/com/pulsevive/bypasspro/MainActivity.java
          package com.pulsevive.bypasspro;

          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.DialogInterface;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AlertDialog;
          import androidx.appcompat.app.AppCompatActivity;

          import org.json.JSONObject;

          import java.io.IOException;
          import java.net.URLEncoder;

          import okhttp3.Call;
          import okhttp3.Callback;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.Response;

          public class MainActivity extends AppCompatActivity {

              private static final String TG_CHANNEL = "https://t.me/sterniterspro";
              private static final String API_BASE = "https://altaf-api-maker.base44.app/functions/lookup?tool=shortner-bypass&key=Bypass&q=";

              private EditText etUrl;
              private Button btnBypass, btnPaste, btnCopy, btnOpen;
              private ProgressBar progressBar;
              private LinearLayout layoutResult;
              private TextView tvResult;
              private ImageView btnTgHeader;

              private OkHttpClient client;
              private SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  client = new OkHttpClient();
                  prefs = getSharedPreferences("bypass_prefs", MODE_PRIVATE);

                  etUrl = findViewById(R.id.etUrl);
                  btnBypass = findViewById(R.id.btnBypass);
                  btnPaste = findViewById(R.id.btnPaste);
                  btnCopy = findViewById(R.id.btnCopy);
                  btnOpen = findViewById(R.id.btnOpen);
                  progressBar = findViewById(R.id.progressBar);
                  layoutResult = findViewById(R.id.layoutResult);
                  tvResult = findViewById(R.id.tvResult);
                  btnTgHeader = findViewById(R.id.btnTgHeader);

                  checkTelegramJoin();

                  btnTgHeader.setOnClickListener(v -> openTelegram());
                  btnPaste.setOnClickListener(v -> pasteFromClipboard());
                  btnBypass.setOnClickListener(v -> executeBypass());
              }

              private void checkTelegramJoin() {
                  boolean joined = prefs.getBoolean("tg_joined", false);
                  if (!joined) {
                      new AlertDialog.Builder(this)
                              .setTitle("VIP Access Required")
                              .setMessage("Shortener bypass use karne ke liye pehle hamara Telegram channel join karein.")
                              .setCancelable(false)
                              .setPositiveButton("1. Join @sterniterspro", (dialog, which) -> openTelegram())
                              .setNegativeButton("2. I Have Joined", (dialog, which) -> {
                                  prefs.edit().putBoolean("tg_joined", true).apply();
                                  dialog.dismiss();
                              })
                              .show();
                  }
              }

              private void openTelegram() {
                  Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(TG_CHANNEL));
                  startActivity(intent);
              }

              private void pasteFromClipboard() {
                  ClipboardManager clipboard = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  if (clipboard != null && clipboard.hasPrimaryClip()) {
                      ClipData.Item item = clipboard.getPrimaryClip().getItemAt(0);
                      if (item != null && item.getText() != null) {
                          etUrl.setText(item.getText().toString().trim());
                          executeBypass();
                      }
                  }
              }

              private void executeBypass() {
                  String url = etUrl.getText().toString().trim();
                  if (url.isEmpty()) {
                      Toast.makeText(this, "Bhai pehle link paste karo!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  progressBar.setVisibility(View.VISIBLE);
                  btnBypass.setEnabled(false);
                  layoutResult.setVisibility(View.GONE);

                  try {
                      String endpoint = API_BASE + URLEncoder.encode(url, "UTF-8");
                      Request request = new Request.Builder().url(endpoint).build();

                      client.newCall(request).enqueue(new Callback() {
                          @Override
                          public void onFailure(Call call, IOException e) {
                              new Handler(Looper.getMainLooper()).post(() -> {
                                  progressBar.setVisibility(View.GONE);
                                  btnBypass.setEnabled(true);
                                  Toast.makeText(MainActivity.this, "Network Error! Connection check karein.", Toast.LENGTH_SHORT).show();
                              });
                          }

                          @Override
                          public void onResponse(Call call, Response response) throws IOException {
                              String raw = response.body().string();
                              String destination = raw;
                              try {
                                  JSONObject json = new JSONObject(raw);
                                  if (json.has("result")) destination = json.getString("result");
                                  else if (json.has("url")) destination = json.getString("url");
                                  else if (json.has("destination")) destination = json.getString("destination");
                              } catch (Exception ignored) {}

                              final String finalDestination = destination.trim();

                              new Handler(Looper.getMainLooper()).post(() -> {
                                  progressBar.setVisibility(View.GONE);
                                  btnBypass.setEnabled(true);
                                  layoutResult.setVisibility(View.VISIBLE);
                                  tvResult.setText(finalDestination);

                                  btnCopy.setOnClickListener(v -> {
                                      ClipboardManager clipboard = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                                      ClipData clip = ClipData.newPlainText("Bypassed URL", finalDestination);
                                      if (clipboard != null) clipboard.setPrimaryClip(clip);
                                      Toast.makeText(MainActivity.this, "Copied to Clipboard!", Toast.LENGTH_SHORT).show();
                                  });

                                  btnOpen.setOnClickListener(v -> {
                                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(finalDestination));
                                      startActivity(intent);
                                  });
                              });
                          }
                      });
                  } catch (Exception e) {
                      progressBar.setVisibility(View.GONE);
                      btnBypass.setEnabled(true);
                      Toast.makeText(this, "Error: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF

      - name: Build Native Release APK
        run: |
          cd native_app
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleRelease --no-daemon

      - name: Upload Native APK
        uses: actions/upload-artifact@v4
        with:
          name: Bypass-Pro-Native-APK
          path: native_app/app/build/outputs/apk/release/app-release.apk
